{% extends 'admin/base_admin.html' %}

{% block admin_title %}Eliminar Producto{% endblock %}

{% block admin_content %}
<div class="card" style="max-width: 500px; margin: 0 auto; text-align: center;">
    <h3>¿Estás seguro de que deseas eliminar este producto?</h3>
    <p style="margin: 20px 0; font-size: 1.2rem; color: #c94c4c;"><strong>{{ object.name }}</strong></p>
    
    <form method="post">
        {% csrf_token %}
        <div class="actions" style="display: flex; gap: 10px; justify-content: center;">
            <button type="submit" class="btn btn-primary" style="background-color: #e74c3c;">Sí, eliminar</button>
            <a href="{% url 'products:admin_product_list' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
